<footer class="footer">
  <div class="footer-row">
    <nav class="footer-links">{% include social.html %}</nav>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button data-theme-value="system" aria-label="System theme">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button data-theme-value="dark" aria-label="Dark theme">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button data-theme-value="light" aria-label="Light theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <p class="copyright">&copy; {{ site.time | date: "%Y" }} <a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
</footer>
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
