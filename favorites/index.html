---
layout: page
title: Favorites
---
<h1 class="page-title">Favorites</h1>
{% for group in site.data.favorites %}
<section class="fav-group">
  <h2 class="section-title">{{ group.category }}</h2>
  <ul class="list fav-list">
    {% for item in group.items %}
    <li><a href="{{ item.url }}"><span class="fav-name">{{ item.name }}</span><span class="fav-note">{{ item.note }}</span></a></li>
    {% endfor %}
  </ul>
</section>
{% endfor %}
